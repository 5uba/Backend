<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Manager | CRUD with MongoDB</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <!-- Header -->
      <header>
        <h1>📋 Task Manager</h1>
        <p class="subtitle">MongoDB CRUD Application</p>
      </header>

      <!-- Add / Edit Form -->
      <section class="form-section card">
        <h2 id="form-title">➕ Add New Task</h2>
        <form id="task-form">
          <div class="form-group">
            <label for="title">Title <span class="required">*</span></label>
            <input
              type="text"
              id="title"
              placeholder="Enter task title..."
              required
            />
          </div>
          <div class="form-group">
            <label for="description">Description</label>
            <textarea
              id="description"
              placeholder="Enter task description (optional)..."
              rows="3"
            ></textarea>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary" id="submit-btn">
              Add Task
            </button>
            <button
              type="button"
              class="btn btn-secondary hidden"
              id="cancel-btn"
            >
              Cancel
            </button>
          </div>
        </form>
      </section>

      <!-- Stats Bar -->
      <section class="stats-bar">
        <span id="total-count">Total: 0</span>
        <span id="completed-count">Completed: 0</span>
        <span id="pending-count">Pending: 0</span>
      </section>

      <!-- Task List -->
      <section class="task-section">
        <h2>📌 All Tasks</h2>
        <div id="loading" class="loading hidden">Loading tasks...</div>
        <div id="empty-state" class="empty-state hidden">
          <p>🎉 No tasks yet. Add your first task above!</p>
        </div>
        <ul id="task-list"></ul>
      </section>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden"></div>

    <script src="app.js"></script>
  </body>
</html>
