<body>
   
    <script>
        // print even number from 2 t0 10:
        for(let n = 2; n<=10; n +=2){
            console.log(n);
        }
        // Explanation:
        // i = 2 ---> starts from 2
        // i <= 10 ---> end in 10
        // i +=2 ---> each time 2 increase
        // Output:
        // 2
        // 4
        // 6
        // 8
        // 10 
    </script>
</body>
