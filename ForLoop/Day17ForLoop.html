        let fuel = [8, 10, 7, 12, 9, 11, 6];
let total = 0;
for (let a = 0; a < fuel.length; a++) {

}
let average = total / fuel.length;+
console.log("Total fuel used = " + total + " litres");
console.log("Average fuel used = " + average + " litres");
